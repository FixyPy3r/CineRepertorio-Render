<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Claquete roxa">
  <defs>
    <clipPath id="forma"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="roxo" cx="95%" cy="0%" r="60%">
      <stop offset="0" stop-color="#785adc" stop-opacity=".30"/>
      <stop offset="1" stop-color="#785adc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faixaFixa"><rect x="9" y="27" width="46" height="9" rx="2"/></clipPath>
    <clipPath id="faixaAberta"><rect x="9" y="18" width="46" height="9" rx="2"/></clipPath>
  </defs>

  <!-- fundo escuro com brilhos suaves -->
  <g clip-path="url(#forma)">
    <rect width="64" height="64" fill="#08060f"/>
    <rect width="64" height="64" fill="url(#roxo)"/>
  </g>

  <!-- corpo da claquete -->
  <rect x="9" y="33" width="46" height="23" rx="4" fill="#191128" stroke="#b86cff" stroke-width="3"/>
  <rect x="15" y="49" width="14" height="2.4" rx="1.2" fill="#b3aacb" opacity=".7"/>
  <rect x="15" y="43" width="9" height="2.4" rx="1.2" fill="#b3aacb" opacity=".7"/>
  <path d="M36 40.5 L47 46 L36 51.5 Z" fill="#ffd16b" stroke="#ffd16b" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- tampa fixa listrada -->
  <rect x="9" y="27" width="46" height="9" rx="2" fill="#a855f7"/>
  <g clip-path="url(#faixaFixa)" stroke="#0c0b12" stroke-width="4.2">
    <path d="M13 37 L19 26 M23 37 L29 26 M33 37 L39 26 M43 37 L49 26 M53 37 L59 26"/>
  </g>

  <!-- tampa aberta listrada, presa na dobradiça -->
  <g transform="rotate(-17 10 27)">
    <rect x="9" y="18" width="46" height="9" rx="2" fill="#d6aaff"/>
    <g clip-path="url(#faixaAberta)" stroke="#0c0b12" stroke-width="4.2">
      <path d="M13 28 L19 17 M23 28 L29 17 M33 28 L39 17 M43 28 L49 17 M53 28 L59 17"/>
    </g>
  </g>
  <!-- dobradiça -->
  <circle cx="10.5" cy="27.5" r="3" fill="#e2607a" stroke="#0c0b12" stroke-width="1.4"/>

  <!-- brilho de estrela -->
  <path d="M15 5 L16.4 8.6 L20 10 L16.4 11.4 L15 15 L13.6 11.4 L10 10 L13.6 8.6 Z" fill="#ffd782"/>
</svg>
