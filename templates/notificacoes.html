{% extends "base.html" %}
{% block conteudo %}
<div class="container" style="max-width: 780px;">
  <section class="hero">
    <p class="selo">Fale com a equipe</p>
    <h1 class="display-6 fw-bold">Notificações e <span class="brilho">mensagens</span></h1>
    <p class="texto-suave">Envie uma sugestão, dúvida ou aviso. Sua mensagem será encaminhada para a equipe do CineRepertório.</p>
  </section>
  <section class="painel">
    <form method="post" action="{{ url_for('notificacoes') }}">
      <div class="mb-3"><label class="form-label" for="nome">Seu nome</label><input class="form-control" id="nome" name="nome" maxlength="100" required></div>
      <div class="mb-3"><label class="form-label" for="email">Seu e-mail</label><input class="form-control" type="email" id="email" name="email" maxlength="160" required></div>
      <div class="mb-3"><label class="form-label" for="assunto">Assunto</label><input class="form-control" id="assunto" name="assunto" maxlength="140" required></div>
      <div class="mb-3"><label class="form-label" for="mensagem">Mensagem</label><textarea class="form-control" id="mensagem" name="mensagem" rows="6" minlength="10" maxlength="4000" required placeholder="Escreva sua mensagem..."></textarea></div>
      <div class="visually-hidden" aria-hidden="true"><label for="website">Deixe este campo vazio</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <button class="btn btn-dourado" type="submit">Enviar mensagem</button>
      <p class="small texto-suave mt-3 mb-0">Destinatário: cinerepertorio@gmail.com</p>
    </form>
  </section>
</div>
{% endblock %}
